# docker-compose-go-angular-sqlite.prod.yaml
services:
  # Back
  go:
    extends:
      file: compose-go.prod.yaml
      service: go
    environment:
      # Base par défaut sqlite
      ## DATABASE_URL: "file:${database.path}/tool.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_time_format=sqlite"
      ## DATABASE_DRIVER: "sqlite"
      ## DATABASE_SQL: "./schema-sqlite.sql"
      ## DATABASE_PATH: "/data/database" # Défaut DockerFile
      MUST_AUTHENTICATE: false
    volumes:
      # - dirExterne:dirConteneur
      - ../database/sqlite:/data/database
    networks: [internal]

  # Front
  angular:
    extends:
      file: compose-angular.prod.yaml
      service: angular
    environment: [BACKEND_URL=http://go:8090]
    depends_on:
      - go
    networks: [internal]

networks:
  internal:

