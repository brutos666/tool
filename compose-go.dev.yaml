services:
  go:
    build:
      context: ./backend-go
      target: dev
    image: tool-go:dev
    # les lignes suivantes servent pour debugger
    ports:
      - "2345:2345"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - "seccomp:unconfined"
    develop:
      watch:
        - action: rebuild
          path: ./backend-go
          ignore:
            - "**/*_test.go"
    environment:
      LISTEN_ADDR: ":8090"

