# docker-compose-go-angular.dev.yaml
services:
  db:
    extends:
      file: compose-postgresql.yaml
      service: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks: [internal]
  go:
    extends:
      file: compose-go.dev.yaml
      service: go
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres?sslmode=disable"
      DATABASE_DRIVER: "postgres"
      DATABASE_SQL: "schema-postgresql.sql"
      MUST_AUTHENTICATE: false
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
  angular:
    extends:
      file: compose-angular.dev.yaml
      service: angular
    environment: [BACKEND_URL=http://go:8090]
    depends_on:
      - go
    networks: [internal]

networks:
  internal:

