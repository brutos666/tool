config.dev=true
#database.datasource.url=postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
#database.datasource.driver=postgres
#database.datasource.sql=schema-postgresql.sql
database.datasource.url=file:../database/sqlite/tool.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_time_format=sqlite
database.datasource.driver=sqlite
database.datasource.sql=schema-sqlite.sql
