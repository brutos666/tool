# docker-compose-go-angular-sqlite.dev.yaml
services:
  back:
    extends:
      file: compose-go.dev.yaml
      service: go
    environment:
      # Base par défaut sqlite
      ## DATABASE_URL: "file:${database.path}/tool.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_time_format=sqlite"
      ## DATABASE_DRIVER: "sqlite"
      ## DATABASE_SQL: "./schema-sqlite.sql"
      ## DATABASE_PATH: "/data/database" # Défaut DockerFile
    volumes:
      # - dirExterne:dirConteneur
      - ../database/sqlite:/data/database
    networks: [internal]
  vanilla:
    extends:
      file: compose-vanilla.dev.yaml
      service: vanilla
    environment: [BACKEND_URL=http://back:8090]
    depends_on:
      - back
    networks: [internal]

networks:
  internal:

