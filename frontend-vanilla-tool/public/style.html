<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      body {
        background: var(--color-bg);
        color: var(--color-text);
        --border-color: var(--color-border);
        margin: 20px;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .swatch {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      .swatch-box {
        width: 200px;
        height: 60px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        background: var(--background-color);
        box-shadow: 3px 3px 4px var(--box-shadow-color);
        padding: 5px;
      }
      .post-it-box {
        width: 150px;
        height: 120px;
        border: none;
        color: var(--text-color);
        background: var(--background-color);
        box-shadow: -7px 7px 6px var(--box-shadow-color), 8px 10px 8px var(--box-shadow-color);
        padding: 5px;
        margin: 10px;
      }
      .status-color::before {
        content: "•";
        color: var(--status-color);
        margin: 5px;
      }
      /* Boutons */
      .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.45rem 1rem; border-radius: 4px;
        cursor: pointer; }
      .btn-primary { background: var(--color-primary); color: var(--color-text-on-primary); }
      .btn-primary:hover { background: var(--color-primary-hover); }
      .btn-ghost { background: transparent; border: 1px solid var(--color-primary); color: var(--color-primary); }
      .btn-ghost:hover { background: var(--color-bg-hover); }
      .btn-neutral   { background: var(--color-bg-surface); color: var(--color-text); border: 1px solid var(--color-border); }
      .btn-neutral:hover { background: var(--color-bg-hover); }

      /* Checkbox */
      .checkbox { display: flex; align-items: center; gap: var(--medium-gap); color: var(--color-text-on-primary); cursor: pointer; }
      .checkbox__input { appearance: none; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--color-primary); background: transparent; cursor: pointer; position: relative; flex-shrink: 0; }
      .checkbox__input:hover { border-color: var(--color-primary-hover); }
      .checkbox__input:checked { background: var(--color-primary); border-color: var(--color-primary); }
      .checkbox__input:checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; 
      border: 2px solid var(--color-text-on-primary); border-top: none; border-left: none; transform: rotate(45deg); }
      .checkbox__input[indeterminate] { background: var(--color-primary); border-color: var(--color-primary); }
      .checkbox__input[indeterminate]::after { content: ''; position: absolute; left: 3px; top: 6px; width: 8px; height: 2px; 
      background: var(--color-text-on-primary); border-radius: 1px; }
      .checkbox__input:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--color-bg-focus); }
      .checkbox__input:disabled { opacity: 0.4; cursor: not-allowed; }

      /* Switch */
      .toggle { display: flex; align-items: center; gap: var(--medium-gap); color: var(--color-text); cursor: pointer; }
      .toggle__input { appearance: none; width: 36px; height: 20px; border-radius: 10px; border: 1.5px solid var(--color-primary); background: var(--color-bg-surface);  cursor: pointer; position: relative;  flex-shrink: 0; }
      .toggle__input::after { content: ''; position: absolute; width: 14px; height: 14px; background: var(--color-text); border-radius: 50%; top: 3px; left: 3px;  box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
      .toggle__input:checked { background: var(--color-primary); }
      .toggle__input:checked::after { transform: translateX(16px); }
      .toggle__input:hover:not(:checked) { background: var(--color-border-hover); }
      .toggle__input:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--color-bg-focus); }
      .toggle__input:disabled { opacity: 0.4; cursor: not-allowed; }

      /* Radio */
      .rb-wrap { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-on-primary); cursor: pointer; }
      .rb { appearance: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--color-border); background: transparent; cursor: pointer; position: relative; transition: border-color 0.15s; flex-shrink: 0; }
      .rb:hover { border-color: var(--color-primary); }
      .rb:checked { border-color: var(--color-control-bg-checked); border-width: 4.5px; background: var(--color-control-bg-checked); box-shadow: inset 0 0 0 3px white; }
      .rb:focus-visible { outline: none; box-shadow: 0 0 0 3px oklch(0.50 0.22 var(--hue) / 0.25); }

      .color-bg {
        --background-color: var(--color-bg);
      }
      .color-bg-surface {
        --background-color: var(--color-bg-surface);
      }
      .color-bg-hover {
        --background-color: var(--color-bg-hover);
      }
      .color-bg-elevated {
        --background-color: var(--color-bg-elevated);
      }
      .color-bg-current {
        --background-color: var(--color-bg-current);
      }
      .color-bg-focus {
        --background-color: var(--color-bg-focus);
      }
      .color-bg-selected {
        --background-color: var(--color-bg-selected);
      }
      .color-text {
        --text-color: var(--color-text);
      }
      .color-text-muted {
        --text-color: var(--color-text-muted);
      }
      .color-text-on-primary {
        --text-color: var(--color-text-on-primary);
      }
      .color-text-on-post-it {
        --text-color: var(--color-text-on-post-it);
      }
      .color-border {
        --border-color: var(--color-border);
      }
      .color-border-hover,
      .color-border:hover {
        --border-color: var(--color-border-hover);
      }
      .color-box-shadow {
        --box-shadow-color: var(--color-box-shadow);
      }
      .color-primary {
        --background-color: var(--color-primary);
      }
      .color-primary-hover,
      .color-primary:hover {
        --background-color: var(--color-primary-hover);
      }
      .color-primary-active {
        --background-color: var(--color-primary-active);
      }
      .color-primary-subtle {
        --background-color: var(--color-primary-subtle);
      }
      .color-secondary {
        --background-color: var(--color-secondary);
      }
      .color-secondary-hover,
      .color-secondary:hover {
        --background-color: var(--color-secondary-hover);
      }
      .color-success {
        --background-color: var(--color-success);
      }
      .color-warning {
        --background-color: var(--color-warning);
      }
      .color-error {
        --background-color: var(--color-error);
      }
      .color-sample {
        --background-color: var(--color-sample);
      }
      .color-rules {
        --background-color: var(--color-rules);
      }
      .color-story {
        --background-color: var(--color-story);
      }
      .color-question {
        --background-color: var(--color-question);
      }
      .color-classic {
        --background-color: var(--color-classic);
      }
      .color-created {
        --status-color: var(--color-created);
      }
      .color-updated {
        --status-color: var(--color-updated);
      }
      .color-control-track-off {
        --background-color: var(--color-control-track-off);
      }
    </style>
    <title>Feuille de styles</title>
  </head>
  <body>
    <div>
      <div>
        <h3>Fond & surfaces</h3>
        <div class="swatches">
          <div class="swatch color-bg">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-bg-surface">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-bg-elevated">
            <div class="swatch-box"></div>
          </div>
          <div></div>
          <div class="swatch color-bg-hover">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-bg-current">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-bg-focus">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-bg-selected">
            <div class="swatch-box"></div>
          </div>
        </div>
      </div>
      <div>
        <h3>Texte et bordures</h3>
        <div class="swatches">
          <div class="swatch color-text color-bg-surface">
            <div class="swatch-box text-color"></div>
          </div>
          <div class="swatch color-text-muted color-bg-surface">
            <div class="swatch-box text-color"></div>
          </div>
          <div class="swatch color-text-on-primary color-primary">
            <div class="swatch-box text-color"></div>
          </div>
          <div class="swatch color-text-on-post-it color-sample">
            <div class="swatch-box text-color"></div>
          </div>
          <div></div>
          <div class="swatch color-border color-bg">
            <div class="swatch-box border-color"></div>
          </div>
          <div class="swatch color-border-hover color-bg">
            <div class="swatch-box border-color"></div>
          </div>
          <div class="swatch color-box-shadow color-border color-bg">
            <div class="swatch-box border-color"></div>
          </div>
        </div>
      </div>
      <div>
        <h3>Couleurs primaires et secondaires </h3>
        <div class="swatches">
          <div class="swatch color-primary">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-primary-hover">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-primary-active">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-primary-subtle">
            <div class="swatch-box"></div>
          </div>
          <div></div>
          <div class="swatch color-secondary">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-secondary-hover">
            <div class="swatch-box"></div>
          </div>
      </div>
      <div>
        <h3>Sémantique </h3>
        <div class="swatches">
          <div class="swatch color-success">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-warning">
            <div class="swatch-box"></div>
          </div>
          <div class="swatch color-error">
            <div class="swatch-box"></div>
          </div>
      </div>
      <div>
        <h3>Post-it </h3>
        <div class="swatches">
          <div class="swatch color-story color-text-on-post-it color-box-shadow">
            <div class="post-it-box"></div>
          </div>
          <div class="swatch color-rules color-text-on-post-it color-box-shadow">
            <div class="post-it-box"></div>
          </div>
          <div class="swatch color-sample color-text-on-post-it color-box-shadow">
            <div class="post-it-box"></div>
          </div>
          <div class="swatch color-question color-text-on-post-it color-box-shadow">
            <div class="post-it-box"></div>
          </div>
          <div class="swatch color-classic color-text-on-post-it color-box-shadow">
            <div class="post-it-box"></div>
          </div>
        </div>
      </div>
      <div>
        <h3>Statut de modification</h3>
        <div class="swatches">
          <div class="swatch color-created color-bg color-text">
            <div class="swatch-box status-color"></div>
          </div>
          <div class="swatch color-updated color-bg color-text">
            <div class="swatch-box status-color"></div>
          </div>
          <div class="swatch color-created color-sample color-text-on-post-it">
            <div class="swatch-box status-color"></div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <h3>Aperçu composants</h3>
      <div class="preview">
        <h4>
          <h4>Boutons</h4>
          <div class="btn-row">
            <button class="btn btn-primary">Sauvegarder</button>
            <button class="btn btn-ghost">Annuler</button>
            <button class="btn btn-neutral">Options</button>
            <button class="btn btn-neutral" disabled style="opacity:0.4;cursor:not-allowed">Désactivé</button>
          </div>
        </div>
        <div>
          <h4>Cases à cocher</h4>
          <div class="row">
            <label class="checkbox"><input type="checkbox" class="checkbox__input" checked> Coché</label>
            <label class="checkbox"><input type="checkbox" class="checkbox__input"> Non coché</label>
            <label class="checkbox"><input type="checkbox" class="checkbox__input" indeterminate> Indéterminé</label>
            <label class="checkbox"><input type="checkbox" class="checkbox__input" disabled> Désactivé</label>
            <label class="checkbox"><input type="checkbox" class="checkbox__input" checked disabled> Désactivé coché</label>
          </div>
        </div>
        <div>
          <h4>Boutons radio</h4>
          <div class="row">
            <label class="rb-wrap"><input type="radio" class="rb" name="r" checked> Option A</label>
            <label class="rb-wrap"><input type="radio" class="rb" name="r"> Option B</label>
            <label class="rb-wrap"><input type="radio" class="rb" name="r"> Option C</label>
          </div>
        </div>
        <div>
          <h4>Switchs</h4>
          <div class="row">
            <label class="toggle"><input type="checkbox" class="toggle__input" checked> Activé</label>
            <label class="toggle"><input type="checkbox" class="toggle__input"> Désactivé</label>
            <label class="toggle"><input type="checkbox" class="toggle__input" disabled> Bloqué</label>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  window.addEventListener("load", () => {
    const elements = document.querySelectorAll(".swatch-box, .post-it-box");
    elements.forEach(el => {
      const secondClassName = "--" + el.parentNode.classList[1];
      let color;
      if (el.classList.contains("status-color")) {
        color = getComputedStyle(el, "::before").color;
      } else if (el.classList.contains("text-color")) {
        color = getComputedStyle(el).color;
      } else if (el.classList.contains("border-color")) {
        color = getComputedStyle(el).borderColor;
      } else {
        color = getComputedStyle(el).backgroundColor;
      }
      el.insertAdjacentElement("beforeBegin", createTextElement(secondClassName));
      el.insertAdjacentElement("beforeBegin", createTextElement(color));
      el.appendChild(document.createTextNode(el.parentNode.classList.value.replace("swatch ", "")));
    });
  });

  function createTextElement(text) {
    const div = document.createElement("div");
    div.appendChild(document.createTextNode(text));
    return div;
  }
</script>
