<button
  #buttonId
  class="clickable {{ button().className }} action__button"
  aria-label="{{ button().label }}"
  [attr.role]="button().role"
  (click)="button().onClick()"
  (mousedown)="onMouseDown($event)"
  tabindex="-1"
>
  @if (button().icon) {
    <span class="button__icon">{{ button().icon }}</span>
  }
  <span class="button__label">{{ button().label }}</span>
</button>
