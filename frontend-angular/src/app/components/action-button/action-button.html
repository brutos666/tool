<button
  #buttonId
  class="clickable {{ data().className }} action__button"
  aria-label="{{ data().label }}"
  [attr.role]="data().role"
  (click)="data().onClick()"
  (mousedown)="onMouseDown($event)"
  tabindex="-1"
>
  @if (data().icon) {
    <span class="button__icon">{{ data().icon }}</span>
  }
  <span class="button__label">{{ data().label }}</span>
</button>
