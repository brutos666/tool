<toolbar class="working-space__toolbar" [buttons]="mainButtons" [toolbarType]="'menu'" [label]="mainLabel"></toolbar>
@if (showConfirm()) {
<confirm-dialog [(show)]="showConfirm" [doCallback]="confirmAction" [question]="confirmQuestion">
  @if (showFileName) {
  <field id="inputFileName" label="Nom du fichier" [(value)]="fileName"></field>
  }
</confirm-dialog>
}
