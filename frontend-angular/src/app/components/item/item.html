<header class="item__header">
  <template id="done" class="item__checkbox" aria-label="Effectué/non effectué"
    aria-description="Cliquez pour marquer comme effectué"></template>
  <div class="item__title" aria-label="Titre de l'item" contenteditable="true" property="text" role="textbox" aria-multiline="true">
    {{ itemData().title }}
  </div>
</header>
<template id="text" class="item__text" aria-label="Détail de l'item"></template>
<footer class="item__footer"></footer>
