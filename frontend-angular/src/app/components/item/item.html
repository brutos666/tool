@let layout=layoutData();
@let content=treeData().getContent();
<article tab-navigation-directive class="item {{getClassForCRUDMode(crudModeData())}} {{getClassForLayout(layoutData())}}">
    <header class="item__header">
      @if (this.hasDone(layout)) {
        <text-input #done [id]="content.getId()+'-done'" label="Effectué/non effectué" class="item__checkbox" aria-description="Cliquez pour marquer comme effectué"
        [value]="content.getState()" (valueChange)="onValueChange($event, 'state')">
      </text-input>
    }
    <text-input #title 
      [id]="content.getId()+'-title'" label="Titre de l'item" class="item__title"
      [value]="content.getTitle()" (valueChange)="onValueChange($event, 'title')">
    </text-input>

    <toolbar [buttons]="buttonsData" aria-controls="itemArticle" class="item__toolbar"></toolbar>
  </header>
  @if (this.hasText(layout)) {
    <text-input #text [id]="content.getId()+'-text'" label="Détail de l'item" class="item__text" [value]="content.getText()"
    (valueChange)="onValueChange($event, 'text')">
  </text-input>
  }
  @if (this.hasFooterToolbar(layout)) {
    <footer class="item__footer"></footer>
  }
</article>
