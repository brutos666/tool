<div 
  popover-directive
  [(show)]="show"
  id="notificationCenter"
  class="notification__center">
  @if (show()) {
    @for (notification of notifications(); track notification.getId()) {
      <notification enter-tab-directive [data]="notification"></notification>
    } @empty {
      Pas de notification
    }
  } @else {
    @for (notification of popNotifications(); track notification.getId()) {
      <notification [data]="notification"></notification>
    }
  }
</div>
<button actionButton
  popup-button-directive
  target="notificationCenter"
  [opened]="show()"
  class="notification__button"
  [data]="notificationButton"></button>
