<li class="menu__element">
  <button actionButton [data]="burgerItem" ></button>
</li>
<menu
  #menu
  id="menu"
  class="menu__actions"
  role="menu"
  (keydown)="onKeyDown($event)"
  (toggle)="onMenuShowHide()"
>
  @for (item of menuItems(); track item.label) {
    <li class="menu__element">
      <button actionButton [data]="item"></button>
    </li>
  } @empty {
    No tabs available.
  }
</menu>
