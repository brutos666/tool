@if (menuOrientation.orientation() === 'vertical') {
  <li class="menu__element">
    <button actionButton
      popup-button-directive target="menuContent" [opened]="menuOpened()"
      #burgerItem
      class="menu__button"
      [data]="burgerItemData"></button>
  </li>
  <menu-content
    popover-directive [(show)]="menuOpened"
    #menu
    id="menuContent"
    class="menu__content"
    [navOrientation]="'vertical'"
    [menuItems]="menuItems()">
  </menu-content>
} @else {
  <menu-content
    #menu
    class="menu__content"
    [navOrientation]="'horizontal'"
    [menuItems]="menuItems()">
</menu-content>
}
