<menu-bar class="working-space__menu" [label]="label" [menuItems]="menuItems"></menu-bar>
<aside #navSpace class="working-space__nav" aria-current="true">
  <space>
    <space-header>Navigation</space-header>
    <space-body>
      <tree-list [dataList]="rootItem().getChildren()" [orientation]="'vertical'" [layoutData]="navLayout"></tree-list>
    </space-body>
    <space-footer>
      <button class="working-space__add-button" actionButton [data]="navAddButton"></button>
    </space-footer>
  </space>
</aside>
<div #splitter class="working-space__splitter" (pointerdown)="onPointerDown($event)">&nbsp;</div>
<main #mainSpace class="working-space__main">
  @let currentTreeData = currentItem();
  @if (currentTreeData) {
    <space>
      <space-header class="main-space__header">
        <tree-content [treeData]="currentTreeData" [layoutData]="mainLayout"></tree-content>
      </space-header>
      <space-body>
        <tree-list [dataList]="currentTreeData.getChildren() || []" [orientation]="'horizontal'" [layoutData]="mainLayout"></tree-list>
      </space-body>
      <space-footer>
        <button actionButton [data]="mainAddButton" class="working-space__add-button main-space__add-button"></button>
      </space-footer>
    </space>
  } @else {
    <p>Sélectionner un élément dans la navigation à gauche</p>
  }
</main>
<notification-center navOrientation="vertical"></notification-center>
