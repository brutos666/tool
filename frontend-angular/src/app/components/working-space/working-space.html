<menu-bar class="working-space__menu" [label]="label" [menuItems]="menuItems"></menu-bar>
<aside #navSpace class="working-space__nav" aria-current="true">
  <space>
    <space-header>Navigation</space-header>
    <space-body>
      <tree-list
        [dataList]="rootItem().getChildren()"
        [orientation]="'vertical'"
        [layoutData]="navLayout"
        [emptyMessage]="emptyStateNav"
        [canBeSelected]="true"
        ></tree-list>
    </space-body>
    <space-footer>
      <button focusable class="working-space__add-button"  [data]="navAddButton" [buttonType]="'item-like'"></button>
    </space-footer>
  </space>
</aside>
<div #splitter class="working-space__splitter" (pointerdown)="onPointerDown($event)">&nbsp;</div>
<main #mainSpace class="working-space__main">
  @let currentTreeData = currentItem();
  @if (currentTreeData) {
    <toolbar class="working-space__toolbar" [buttons]="mainButtons" [toolbarType]="'menu'" [label]="mainLabel"></toolbar>
    <space>
      <space-header class="main-space__header">
        <item enter-tab-directive [treeData]="currentTreeData" [layoutData]="mainLayout" [title]="true"></item>
      </space-header>
      <space-body>
        <tree-list [dataList]="currentTreeData.getChildren() || []" [orientation]="'horizontal'" [layoutData]="mainLayout"></tree-list>
      </space-body>
      <space-footer>
        <button focusable [data]="mainAddButton" class="working-space__add-button main-space__add-button" [buttonType]="'item-like'"></button>
      </space-footer>
    </space>
  } @else {
    <p class="working-space__empty-state" [innerHTML]="emptyStateMain"></p>
  }
</main>
<notification-center arrow-navigation-directive [navOrientation]="'vertical'"></notification-center>
@if (showConfirm()) {
  <confirm-dialog [(show)]="showConfirm" [doCallback]="confirmAction" [question]="confirmQuestion"></confirm-dialog>
}
