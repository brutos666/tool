<menu-bar class="working-space__menu" [label]="label" [menuItems]="menuItems"></menu-bar>
<aside-space #navSpace class="working-space__nav" aria-current="true" title="Navigation">
  <ng-template #itemTemplate let-tree="content">
    <article item [treeData]="tree"></article>
  </ng-template>
  <tree-list [dataList]="rootItem().getChildren()" [contentTemplate]="itemTemplate"></tree-list>
</aside-space>
<div #splitter class="working-space__splitter" (pointerdown)="onPointerDown($event)">&nbsp;</div>
<main #mainSpace class="working-space__main">
  <ng-template #itemTemplateMain let-tree="content">
    <article item [treeData]="tree" [layoutData]="mainLayout"></article>
  </ng-template>
  <tree-list [dataList]="rootItem().getChildren()" [contentTemplate]="itemTemplateMain"></tree-list>
</main>
