<workspace-menu-bar class="working-space__menu"></workspace-menu-bar>
<aside #navSpace class="working-space__nav" aria-current="true">
  <workspace-nav></workspace-nav>
</aside>
<div #splitter class="working-space__splitter" (pointerdown)="onPointerDown($event)">&nbsp;</div>
<main #mainSpace class="working-space__main">
  @let currentTreeData = currentItem();
  @if (currentTreeData) {
  <workspace-main-toolbar></workspace-main-toolbar>
  <workspace-todo-list [treeData]="currentTreeData"></workspace-todo-list>
  } @else {
  <p class="working-space__empty-state" [innerHTML]="emptyStateMain"></p>
  }
</main>
<notification-center arrow-navigation-directive [navOrientation]="'vertical'"></notification-center>
