<menu-bar class="working-space__menu" [label]="label" [menuItems]="menuItems"></menu-bar>
<aside #navSpace class="working-space__nav" aria-current="true">
  <space>
    <space-header><h1>Navigation</h1></space-header>
    <space-body>
      <tree-list [dataList]="rootItem().getChildren()" [navOrientation]="'vertical'" [layoutData]="navLayout"></tree-list>
    </space-body>
    <space-footer>
      <button class="working-space__add-button" actionButton [data]="addNewTreeButton"></button>
    </space-footer>
  </space>
</aside>
<div #splitter class="working-space__splitter" (pointerdown)="onPointerDown($event)">&nbsp;</div>
<main #mainSpace class="working-space__main">
  <tree-list [dataList]="currentItem()?.getChildren() || []" [navOrientation]="'vertical'" [layoutData]="mainLayout"></tree-list>
</main>
