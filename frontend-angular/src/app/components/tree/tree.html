<div class="tree" 
[ngClass]="{'tree--node':treeData().getChildren().length, 'tree--leaf':treeData().getChildren().length === 0, 'tree--root':isRoot() }" 
role="treeitem" 
position="inside" 
[attr.item-id]= "treeData().getItemId()" 
[attr.tree-item-id]= "treeData().getTreeItemId()">
  <button basicButton class="tree__toggle" [data]="toggleIcon" (click)="onOpenClose()"></button>
  <tree-content class="tree__content" [contentTemplate]="contentTemplate()" [treeData]="treeData()">
  </tree-content>
  <ul #treeList class="tree__list hidden" aria-orientation="vertical" role="group">
    @for (child of treeData().getChildren(); track child.getTreeItemId()) {
      <tree [treeData]="child" [contentTemplate]="contentTemplate()"></tree>
    }
  </ul>
</div>
