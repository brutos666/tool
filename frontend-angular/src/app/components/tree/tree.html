<button noFocusable #toggle class="tree__toggle" [data]="toggleIcon" [buttonType]="'icon'"></button>
<tree-content 
  class="tree__content"
  [selectable]="selectable()"
  [selected]="this.itemService.isCurrentItem(treeData())"
  (selectedChange)="$event && this.itemService.setCurrentItem(treeData())"
  [layoutData]="layoutData()"
  [treeData]="treeData()">
</tree-content>
<ul #treeList class="tree__list hidden" aria-orientation="vertical" role="group">
  @for (child of treeData().getChildren(); track child.getTreeItemId()) {
    <li class="tree__element">
      @if (selectable()) {
        <tree
        [selectable]="true"
        [treeData]="child"
        [layoutData]="layoutData()"></tree>
    } @else {
      <tree [treeData]="child" [layoutData]="layoutData()"></tree>
    }
    </li>
  }
</ul>
