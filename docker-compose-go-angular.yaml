services:
  # Base de données
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      # Dans le répertoire du projet
      - ./database:/var/lib/postgresql/18/docker
      # Script d'initialisation des tables (même si c'est fait aussi dans le démarrage de Go, c'est peut-être mieux de le faire plutôt ici)
      - ./backend-go/schema-postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # [brutos] : J'ai une base de données qui démarre automatiquement sur ma machine sur le port 5432 (à virer à terme) donc je met 5433 à la place
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Back en Go
  go:
    build:
      context: ./backend-go
      target: prod
    image: tool-go:prod
    ports:
      - "8090:8090"
    environment:
      LISTEN_ADDR: ":8090"
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres?sslmode=disable"
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy

  # Front en angular
  angular:
    build:
      context: ./frontend-angular
      target: prod
    image: tool-angular:prod
    environment: [BACKEND_URL=http://go:8090]
    ports:
      - "8080:8080"
    depends_on:
      - go
    networks: [internal]

networks:
  internal:

