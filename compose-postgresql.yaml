services:
  # base de données postgreSql
  postgresql:
    image: postgres:18.6-alpine3.24
    volumes:
      # Dans le répertoire du projet
      - ./database/postgresql:/var/lib/postgresql/18/docker
    ports:
      # [brutos] : J'ai une base de données qui démarre automatiquement sur ma machine sur le port 5432 (à virer à terme) donc je met 5433 à la place
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    # environment:
    #   POSTGRES_USER: xxx
    #   POSTGRES_PASSWORD: xxx
    #   POSTGRES_DB: xxx

